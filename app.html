<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>Electrical Career Readiness Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,system-ui,sans-serif;background:#f5f6f4;color:#1b2430}button,input,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:240px;flex:0 0 240px;background:#0f1b2d;color:#dce6f2;padding:16px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:15px;line-height:1.15;padding-bottom:16px;border-bottom:1px solid #fff2}.brand small{display:block;color:#8fa3bc;font:10px monospace;margin-top:5px}.nav{list-style:none;margin:0;padding:12px 0;flex:1}.nav li{margin:2px 0}.nav button{width:100%;border:0;background:transparent;color:#c9d6e5;padding:10px;border-left:3px solid transparent;border-radius:6px;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.nav button.active{border-left-color:#ff9f1c}.foot{border-top:1px solid #fff2;padding-top:12px;color:#7e93ac;font:10px monospace}.wrap{flex:1;min-width:0}.mobilebar{display:none;background:#0f1b2d;color:#fff;padding:11px 14px;align-items:center;gap:10px}.mobilebar button{background:#fff;color:#0f1b2d;border:0;border-radius:5px;padding:7px 10px}.main{max-width:1200px;padding:30px}.ey{font:11px monospace;color:#a96209}.head h1{margin:4px 0}.sub{color:#5b6472;margin-top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #d8dce1;border-radius:8px;padding:16px}.big{font-size:28px;font-weight:800;margin:5px 0}.muted{color:#5b6472}.bar{height:6px;background:#ebedef;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#ff9f1c}.section{display:flex;gap:8px;align-items:center;margin:26px 0 10px;font-weight:800}.rule{height:1px;background:#d8dce1;flex:1}.btn{background:#0f1b2d;color:#fff;border:0;border-radius:6px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.ghost{background:#fff;color:#0f1b2d;border:1px solid #d8dce1}.week{background:#fff;border:1px solid #d8dce1;border-radius:8px;margin:7px 0}.weekhead{width:100%;border:0;background:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer}.wn{font:11px monospace;color:#a96209;width:45px}.wt{font-weight:700;flex:1}.count{font:11px monospace;color:#5b6472}.body{display:none;padding:0 14px 14px}.week.open .body{display:block}.stage{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid #eef0f2;font-size:13px}.stage:first-child{border-top:0}.stage input{margin-top:2px}.skills{padding:14px 0;border-top:1px solid #eef0f2}.skills:first-child{border-top:0}.badge{font:10px monospace;background:#fff3de;color:#a35e00;padding:2px 7px;border-radius:99px}.form{display:grid;gap:10px}.form input,.form textarea,.edit{width:100%;padding:9px;border:1px solid #d8dce1;border-radius:6px;background:#fff}.form textarea{min-height:70px;resize:vertical}.entry{padding:12px 0;border-top:1px solid #eef0f2}.entry:first-child{border-top:0}.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.empty{padding:24px;text-align:center;border:1px dashed #d8dce1;border-radius:8px;color:#5b6472}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block}.side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);z-index:10}.side.open{transform:none}.mobilebar{display:flex;position:fixed;left:0;right:0;top:0;z-index:12}.main{padding:72px 16px 28px}.grid,.evidence-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mobilebar"><button id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button><strong>Electrical Career Readiness Hub</strong></div>
<div class="app">
<aside class="side" id="side" aria-label="Main navigation">
<div class="brand">Electrical Career Readiness Hub<small>Senior Electrical Designer track</small></div>
<ul class="nav" id="nav"></ul>
<div class="foot">Canonical production app<br>24-week readiness pathway</div>
</aside>
<main class="main" id="main" tabindex="-1"></main>
</div>
<script>
(function(){
'use strict';
const sections=[['home','Home'],['course','Course'],['skills','Skills'],['journal','Journal'],['portfolio','Portfolio'],['settings','Settings']];
const curriculum=[
['Foundations','AutoCAD workspace, standards & layer discipline'],['Foundations','MicroStation CONNECT fundamentals & level structures'],['Foundations','Electrical symbol libraries & drawing conventions'],['Foundations','Single line diagrams: reading and producing'],['Foundations','Cable schedules & termination drawings'],['Foundations','AS/NZS 3000 wiring rules — structure and application'],
['Design Ownership','Owning a drawing package end to end'],['Design Ownership','Power distribution board layouts'],['Design Ownership','Cable sizing and voltage drop calculations'],['Design Ownership','Protection & discrimination basics'],['Design Ownership','Earthing and bonding design'],['Design Ownership','Coordinating with mechanical & civil disciplines'],
['Advanced Technical','OpenBuildings / 3D model coordination'],['Advanced Technical','Navisworks clash detection workflow'],['Advanced Technical','Hazardous area classification basics'],['Advanced Technical','Switchboard & MCC layout design'],['Advanced Technical','Instrumentation & control interfaces'],['Advanced Technical','AS/NZS 3008 & load calculations deep dive'],
['QA & Leadership','Design checking & QA review technique'],['QA & Leadership','Redline markup discipline & drawing revisions'],['QA & Leadership','Reviewing and mentoring junior drafters'],['QA & Leadership','Client and multidisciplinary communication'],['Portfolio & Interview','Building a senior-level portfolio package'],['Portfolio & Interview','Interview readiness & technical Q&A practice']
];
const defaults={weeks:curriculum.map(()=>({learn:false,apply:false,check:false,evidence:false})),skills:[['AutoCAD',3,4],['MicroStation CONNECT',4,5],['Electrical drafting & documentation',4,5],['Electrical design ownership',2,4],['AS/NZS application',3,5],['Power distribution design',2,4],['Calculations & sizing',2,4],['3D / BIM coordination',2,3],['QA / design checking',3,4],['Leadership & mentoring',1,3]].map(x=>({name:x[0],current:x[1],target:x[2]})),journal:[],portfolio:[],target:6};
let state=clone(defaults),page='home',openWeek=0;
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const saved=JSON.parse(localStorage.getItem('ecrh-canonical')||'null');if(saved)state=Object.assign(clone(defaults),saved)}catch(e){}}
function save(){try{localStorage.setItem('ecrh-canonical',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[c])})}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML='';sections.forEach(function(s){const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.textContent=s[1];if(page===s[0])b.className='active';b.addEventListener('click',function(){page=s[0];openWeek=0;closeMenu();render()});li.appendChild(b);nav.appendChild(li)})}
function progress(){let done=0;state.weeks.forEach(function(w){['learn','apply','check','evidence'].forEach(function(k){if(w[k])done++})});return done}
function nextIndex(){for(let i=0;i<state.weeks.length;i++){const w=state.weeks[i];if(!(w.learn&&w.apply&&w.check&&w.evidence))return i}return -1}
function header(a,b,c){return '<div class="ey">'+esc(a)+'</div><div class="head"><h1>'+esc(b)+'</h1><p class="sub">'+esc(c)+'</p></div>'}
function stat(a,b,c,p){return '<div class="card"><div class="muted">'+esc(a)+'</div><div class="big">'+esc(b)+'</div><div class="muted">'+esc(c)+'</div>'+(p==null?'':'<div class="bar"><span style="width:'+Math.max(0,Math.min(100,p))+'%"></span></div>')+'</div>'}
function renderHome(main){const d=progress(),n=nextIndex();main.innerHTML=header('OVERVIEW','Welcome back','Senior Electrical Designer readiness — 24-week program')+'<div class="grid">'+stat('Program progress',Math.round(d/96*100)+'%',d+' / 96 stages logged',d/96*100)+stat('Study streak',state.journal.length?'Active':'0 days',state.journal.length?'keep building momentum':'log a Journal session')+stat('Weekly target',''+state.target+' hrs','set in Settings')+stat('Evidence filed',''+state.portfolio.length,'portfolio items')+'</div><div class="section">Next best action<span class="rule"></span></div><div class="card">'+(n<0?'<b>All 24 weeks complete</b><p class="muted">Your next step is to strengthen portfolio evidence and interview readiness.</p>':'<b>Week '+(n+1)+': '+esc(curriculum[n][1])+'</b><p class="muted">Continue with the next unfinished Learn → Apply → Check → Evidence stage.</p><button class="btn" id="openNext">Open activity</button>')+'</div><div class="section">Priority skill gaps<span class="rule"></span></div><div class="card">'+state.skills.slice().sort(function(a,b){return(b.target-b.current)-(a.target-a.current)}).slice(0,3).map(function(s){return'<div class="skills"><b>'+esc(s.name)+'</b> <span class="badge">current '+s.current+' → target '+s.target+'</span></div>'}).join('')+'</div>'+(n<0?'':'');if(n>=0)document.getElementById('openNext').addEventListener('click',function(){page='course';openWeek=n+1;render()})}
function renderCourse(main){let html=header('COURSE','24-week program','Learn → Apply → Check → Evidence, one week at a time');curriculum.forEach(function(c,i){const w=state.weeks[i],done=['learn','apply','check','evidence'].filter(function(k){return w[k]}).length,open=openWeek===i+1;html+='<div class="week '+(open?'open':'')+'"><button class="weekhead" data-week="'+(i+1)+'"><span class="wn">W'+String(i+1).padStart(2,'0')+'</span><span class="wt">'+esc(c[1])+'</span><span class="count">'+done+'/4</span></button><div class="body">';[['learn','Learn'],['apply','Apply'],['check','Check'],['evidence','Evidence']].forEach(function(s){html+='<label class="stage"><input type="checkbox" data-stage="'+i+'|'+s[0]+'" '+(w[s[0]]?'checked':'')+'><span><b>'+s[1]+'</b><br><span class="muted">'+esc(stageText(s[0]))+'</span></span></label>'});html+='</div></div>'});main.innerHTML=html;main.querySelectorAll('[data-week]').forEach(function(b){b.addEventListener('click',function(){openWeek=Number(b.dataset.week)===openWeek?0:Number(b.dataset.week);render()})});main.querySelectorAll('[data-stage]').forEach(function(cb){cb.addEventListener('change',function(){const parts=cb.dataset.stage.split('|');state.weeks[Number(parts[0])][parts[1]]=cb.checked;save();render()})})}
function stageText(k){return k==='learn'?'Study the core concept and relevant reference standard.':k==='apply'?'Produce or revise a drawing/calculation applying the concept.':k==='check'?'Self-check the output against the required design/documentation criteria.':'File the output as portfolio evidence and write a short reflection.'}
function renderSkills(main){let html=header('SKILLS','Competency tracker','Current level vs. target level, 1–5')+'<div class="card">';state.skills.forEach(function(s,i){const gap=s.target-s.current;html+='<div class="skills"><div><b>'+esc(s.name)+'</b> <span class="badge">'+(gap>0?'gap '+gap:'at target')+'</span></div><input type="range" min="1" max="5" step="1" value="'+s.current+'" data-skill="'+i+'" aria-label="'+esc(s.name)+' current level"></div>'});main.innerHTML=html+'</div>';main.querySelectorAll('[data-skill]').forEach(function(r){r.addEventListener('input',function(){state.skills[Number(r.dataset.skill)].current=Number(r.value);save();renderSkills(main)})})}
function renderJournal(main){main.innerHTML=header('JOURNAL','Study log','Record each study session and reflect on what changed');const card=document.createElement('div');card.className='card';const form=document.createElement('div');form.className='form';form.innerHTML='<input id="jDate" type="date" value="'+new Date().toISOString().slice(0,10)+'"><input id="jHours" type="number" min="0" step="0.25" placeholder="Hours"><textarea id="jStudied" placeholder="What did you study?"></textarea><textarea id="jUnder" placeholder="What did you understand or produce?"></textarea><textarea id="jDiff" placeholder="What was difficult?"></textarea><textarea id="jNext" placeholder="What next?"></textarea><button class="btn" id="logBtn" type="button">Log entry</button>';card.appendChild(form);main.appendChild(card);const sec=document.createElement('div');sec.className='section';sec.innerHTML='History<span class="rule"></span>';main.appendChild(sec);const hist=document.createElement('div');hist.className='card';hist.innerHTML=state.journal.length?state.journal.map(function(x){return'<div class="entry"><b>'+esc(x.date)+' · '+esc(x.hours)+' hrs</b><div>'+esc(x.studied)+'</div><div class="muted">'+esc(x.understood||'')+'</div></div>'}).join(''):'<div class="empty">No entries yet.</div>';main.appendChild(hist);document.getElementById('logBtn').addEventListener('click',function(){const studied=document.getElementById('jStudied').value.trim();if(!studied)return;state.journal.unshift({date:document.getElementById('jDate').value,hours:document.getElementById('jHours').value||0,studied:studied,understood:document.getElementById('jUnder').value,difficult:document.getElementById('jDiff').value,next:document.getElementById('jNext').value});save();render()})}
function renderPortfolio(main){let html=header('PORTFOLIO','Evidence','Sanitized evidence of senior-level capability')+'<button class="btn" id="addEvidence" type="button">+ Add evidence item</button><div class="evidence-grid" style="margin-top:16px">';if(!state.portfolio.length)html+='<div class="empty">No evidence yet. Add evidence from completed course work.</div>';state.portfolio.forEach(function(x,i){html+='<div class="card"><input class="edit" data-ptitle="'+i+'" value="'+esc(x.title)+'"><textarea class="edit" data-pdesc="'+i+'" style="margin-top:8px;min-height:100px">'+esc(x.desc)+'</textarea><button class="btn" data-premove="'+i+'" type="button" style="margin-top:8px">Remove</button></div>'});main.innerHTML=html+'</div>';document.getElementById('addEvidence').addEventListener('click',function(){state.portfolio.unshift({title:'New evidence item',desc:'Describe the deliverable, your role, and the standard applied.'});save();render()});main.querySelectorAll('[data-ptitle]').forEach(function(i){i.addEventListener('change',function(){state.portfolio[Number(i.dataset.ptitle)].title=i.value;save()})});main.querySelectorAll('[data-pdesc]').forEach(function(i){i.addEventListener('change',function(){state.portfolio[Number(i.dataset.pdesc)].desc=i.value;save()})});main.querySelectorAll('[data-premove]').forEach(function(b){b.addEventListener('click',function(){state.portfolio.splice(Number(b.dataset.premove),1);save();render()})})}
function renderSettings(main){main.innerHTML=header('SETTINGS','Documentation & backup','Study target and learning guide');const c=document.createElement('div');c.className='card';c.innerHTML='<label><b>Weekly study hours target</b><input id="target" type="number" min="1" step="0.5" value="'+state.target+'" style="display:block;margin-top:8px;width:110px"></label>';main.appendChild(c);const sec=document.createElement('div');sec.className='section';sec.innerHTML='Learning guide<span class="rule"></span>';main.appendChild(sec);const guide=document.createElement('div');guide.className='card muted';guide.textContent='24-week Senior Electrical Designer readiness pathway using Learn → Apply → Check → Evidence. Focus areas include AutoCAD, MicroStation CONNECT, electrical documentation, design ownership, AS/NZS application, power distribution, calculations, 3D/BIM, QA, leadership, portfolio and interview readiness.';main.appendChild(guide);document.getElementById('target').addEventListener('change',function(){state.target=Number(this.value)||6;save()})}
function render(){renderNav();const main=document.getElementById('main');if(page==='home')renderHome(main);else if(page==='course')renderCourse(main);else if(page==='skills')renderSkills(main);else if(page==='journal')renderJournal(main);else if(page==='portfolio')renderPortfolio(main);else renderSettings(main)}
function closeMenu(){document.getElementById('side').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function init(){load();document.getElementById('menuBtn').addEventListener('click',function(){const s=document.getElementById('side');const open=!s.classList.contains('open');s.classList.toggle('open',open);this.setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});render()}
init();
})();
</script>
</body>
</html>
