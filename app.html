<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1b2d"><title>Electrical Career Readiness Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#1b2430;font:14px Segoe UI,system-ui,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#0f1b2d;color:#dce6f2;padding:16px;flex:0 0 230px}.brand{font-weight:800;font-size:15px;padding-bottom:16px;border-bottom:1px solid #fff2}.brand small{display:block;font:10px monospace;color:#8fa3bc;margin-top:4px}.nav{list-style:none;padding:12px 0;margin:0}.nav button{width:100%;border:0;background:transparent;color:#c9d6e5;text-align:left;padding:10px;border-left:3px solid transparent;border-radius:6px;cursor:pointer}.nav button.active,.nav button:hover{background:#fff1;color:#fff}.nav button.active{border-left-color:#ff9f1c}.foot{position:fixed;bottom:0;width:198px;border-top:1px solid #fff2;padding:12px 0;color:#7e93ac;font:10px monospace}.main{flex:1;max-width:1200px;padding:30px}.ey{font:11px monospace;color:#a96209}.head h1{margin:4px 0}.sub,.muted{color:#5b6472}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #d8dce1;border-radius:8px;padding:16px}.big{font-size:28px;font-weight:800;margin:4px 0}.section{display:flex;gap:8px;align-items:center;margin:26px 0 10px;font-weight:800}.rule{height:1px;background:#d8dce1;flex:1}.btn{background:#0f1b2d;color:#fff;border:0;border-radius:6px;padding:9px 13px;font-weight:700;cursor:pointer}.week{background:#fff;border:1px solid #d8dce1;border-radius:8px;margin:7px 0}.wh{width:100%;border:0;background:#fff;padding:12px;display:flex;gap:12px;text-align:left;cursor:pointer}.wn{font:11px monospace;color:#a96209}.wt{flex:1;font-weight:700}.body{display:none;padding:0 14px 14px}.week.open .body{display:block}.stage{padding:8px 0;border-top:1px solid #eef0f2}.stage label{margin-left:8px}.form{display:grid;gap:10px}.form input,.form textarea,.edit{width:100%;padding:8px;border:1px solid #d8dce1;border-radius:6px}.form textarea{min-height:70px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.badge{font:10px monospace;background:#fff3de;color:#a35e00;padding:2px 6px;border-radius:99px}.skill{padding:12px 0;border-top:1px solid #eef0f2}.empty{padding:24px;text-align:center;border:1px dashed #d8dce1;border-radius:8px;color:#5b6472}@media(max-width:800px){.grid,.g2{grid-template-columns:1fr 1fr}}@media(max-width:600px){.mobile{display:flex;position:fixed;top:0;left:0;right:0;background:#0f1b2d;color:#fff;padding:11px 14px;z-index:5;gap:10px}.mobile button{background:#fff;color:#0f1b2d;border:0;border-radius:5px}.app{display:block}.side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);z-index:4;width:250px}.side.open{transform:none}.main{padding:65px 16px 25px}.grid,.g2{grid-template-columns:1fr}.foot{position:absolute;width:218px}}@media(min-width:601px){.mobile{display:none}}</style><div class="mobile"><button class="btn" id="menu">☰</button><b>Electrical Career Readiness Hub</b></div><div class="app"><aside class="side" id="side"><div class="brand">Electrical Career Readiness Hub<small>Senior Electrical Designer track</small></div><ul class="nav" id="nav"></ul><div class="foot">Canonical build<br>24-week readiness pathway</div></aside><div class="scrim" id="scrim"></div><main class="main" id="main"></main></div><script>var S=[['home','Home'],['course','Course'],['skills','Skills'],['journal','Journal'],['portfolio','Portfolio'],['settings','Settings']],C=['AutoCAD workspace, standards & layer discipline','MicroStation CONNECT fundamentals','Electrical symbols & drawing conventions','Single line diagrams','Cable schedules & termination drawings','AS/NZS 3000 wiring rules','Drawing package ownership','Power distribution layouts','Cable sizing & voltage drop','Protection & discrimination','Earthing & bonding','Multidisciplinary coordination','OpenBuildings / 3D coordination','Navisworks clash workflow','Hazardous area basics','Switchboard & MCC layouts','Instrumentation & control interfaces','AS/NZS 3008 & load calculations','Design checking & QA','Redline markup & revisions','Mentoring junior drafters','Client communication','Senior portfolio package','Interview & technical Q&A'],K=[['AutoCAD',3,4],['MicroStation CONNECT',4,5],['Electrical drafting',4,5],['Design ownership',2,4],['AS/NZS application',3,5],['Power distribution',2,4],['Calculations & sizing',2,4],['3D / BIM',2,3],['QA / checking',3,4],['Leadership',1,3]];var st={p:'home',o:0,w:C.map(function(){return{learn:0,apply:0,check:0,evidence:0}}),j:[],port:[],k:K.map(function(x){return{name:x[0],current:x[1],target:x[2]}}),target:6};try{st=Object.assign(st,JSON.parse(localStorage.ecrh||'{}'))}catch(e){}function save(){try{localStorage.ecrh=JSON.stringify(st)}catch(e){}}function nav(){document.getElementById('nav').innerHTML=S.map(function(x){return'<li><button class="'+(st.p===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button></li>'}).join('')}function go(p){st.p=p;st.o=0;render();close()}function header(a,b,c){return'<div class="ey">'+a+'</div><div class="head"><h1>'+b+'</h1><p class="sub">'+c+'</p></div>'}function card(a,b,c){return'<div class="card"><div class="muted">'+a+'</div><div class="big">'+b+'</div><div class="muted">'+c+'</div></div>'}function home(){var d=0;st.w.forEach(function(x){d+=x.learn+x.apply+x.check+x.evidence});var n=st.w.findIndex(function(x){return!x.learn||!x.apply||!x.check||!x.evidence});return header('OVERVIEW','Welcome back','Senior Electrical Designer readiness — 24-week program')+'<div class="grid">'+card('Program progress',Math.round(d/96*100)+'%',d+' / 96 stages')+card('Study streak',st.j.length?'Active':'0 days','Log sessions in Journal')+card('This week','0.0 / '+st.target+' hrs','Study target')+card('Evidence filed',st.port.length,'Portfolio items')+'</div><div class="section">Next best action<span class="rule"></span></div><div class="card"><b>'+ (n<0?'All 24 weeks complete':'Week '+(n+1)+': '+C[n]) +'</b><p class="muted">Continue with the next unfinished learning stage.</p>'+(n>=0?'<button class="btn" onclick="goCourse('+(n+1)+')">Open activity</button>':'')+'</div><div class="section">Priority skill gaps<span class="rule"></span></div><div class="card">'+st.k.slice().sort(function(a,b){return(b.target-b.current)-(a.target-a.current)}).slice(0,3).map(function(x){return'<div class="skill"><b>'+x.name+'</b> <span class="badge">current '+x.current+' → target '+x.target+'</span></div>'}).join('')+'</div>'}function goCourse(w){st.p='course';st.o=w;render()}function course(){var h=header('COURSE','24-week program','Learn → Apply → Check → Evidence');C.forEach(function(c,i){var w=st.w[i],d=w.learn+w.apply+w.check+w.evidence,o=st.o===i+1;h+='<div class="week '+(o?'open':'')+'"><button class="wh" onclick="toggleWeek('+(i+1)+')"><span class="wn">W'+String(i+1).padStart(2,'0')+'</span><span class="wt">'+c+'</span><span class="muted">'+d+'/4 ›</span></button><div class="body">'+[['learn','Learn'],['apply','Apply'],['check','Check'],['evidence','Evidence']].map(function(s){return'<div class="stage"><input type="checkbox" '+(w[s[0]]?'checked':'')+' onchange="setStage('+i+',\''+s[0]+'\',this.checked)"><label>'+s[1]+'</label></div>'}).join('')+'</div></div>'});return h}function toggleWeek(w){st.o=st.o===w?0:w;render()}function setStage(i,k,v){st.w[i][k]=v;save();render()}function skills(){return header('SKILLS','Competency tracker','Current level vs target level, 1–5')+'<div class="card">'+st.k.map(function(x,i){return'<div class="skill"><b>'+x.name+'</b> <span class="badge">'+(x.target-x.current?'gap '+(x.target-x.current):'at target')+'</span><input type="range" min="1" max="5" value="'+x.current+'" oninput="st.k['+i+'].current=+this.value;save();render()"></div>'}).join('')+'</div>'}function journal(){return header('JOURNAL','Study log','Record every study session')+'<div class="card"><div class="form"><input id="d" type="date" value="'+new Date().toISOString().slice(0,10)+'"><input id="h" type="number" min="0" step=".25" placeholder="Hours"><textarea id="s" placeholder="What did you study?"></textarea><textarea id="u" placeholder="What did you understand or produce?"></textarea><button class="btn" onclick="logJ()">Log entry</button></div></div><div class="section">History<span class="rule"></span></div><div class="card">'+(st.j.length?st.j.map(function(x){return'<div class="skill"><b>'+x.d+' · '+x.h+' hrs</b><div>'+x.s+'</div><div class="muted">'+(x.u||'')+'</div></div>'}).join(''):'<div class="muted">No entries yet.</div>')+'</div>'}function logJ(){var s=document.getElementById('s').value;if(!s)return;st.j.unshift({d:document.getElementById('d').value,h:document.getElementById('h').value||0,s:s,u:document.getElementById('u').value});save();render()}function portfolio(){var h=header('PORTFOLIO','Evidence','Sanitized evidence of senior-level capability')+'<button class="btn" onclick="addP()">+ Add evidence item</button><div class="g2" style="margin-top:16px">';if(!st.port.length)h+='<div class="card muted">No evidence yet.</div>';st.port.forEach(function(x,i){h+='<div class="card"><input value="'+x.t+'" onchange="st.port['+i+'].t=this.value;save()"><textarea class="form" onchange="st.port['+i+'].d=this.value;save()">'+x.d+'</textarea></div>'});return h+'</div>'}function addP(){st.port.unshift({t:'New evidence item',d:'Describe the deliverable, your role, and the standard applied.'});save();render()}function settings(){return header('SETTINGS','Documentation & backup','Study target and learning guide')+'<div class="card"><b>Weekly study hours target</b><input style="float:right;width:90px" type="number" value="'+st.target+'" onchange="st.target=+this.value||6;save();render()"></div><div class="section">Learning guide<span class="rule"></span></div><div class="card muted">24-week Senior Electrical Designer readiness pathway using Learn → Apply → Check → Evidence.</div>'}function close(){document.getElementById('side').classList.remove('open')}function render(){nav();var m=document.getElementById('main');m.innerHTML=st.p==='home'?home():st.p==='course'?course():st.p==='skills'?skills():st.p==='journal'?journal():st.p==='portfolio'?portfolio():settings()}document.getElementById('menu').onclick=function(){document.getElementById('side').classList.add('open')};render();</script>
