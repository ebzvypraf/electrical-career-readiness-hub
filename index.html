<style>

<div class="app">

<script>

function weekHours(){const cut=new Date(Date.now()-7*86400000);return state.journal.filter(x=>new Date(x.date+'T00:00:00')>=cut).reduce((a,x)=>a+(Number(x.hours)||0),0)}

function home(main){main.append(head('OVERVIEW','Welcome back','Senior Electrical Designer readiness — 24-week program'));const p=progress(),h=weekHours(),s=streak(),n=next();main.append(el('div',{class:'grid g4'},stat('Program progress',p.pct+'%',p.done+' / '+p.total+' stages logged',p.pct),stat('Study streak',s+' days',s?'keep it going':'log a journal entry'),stat('This week',h.toFixed(1)+' / '+state.settings.weeklyTarget+' hrs',h>=state.settings.weeklyTarget?'target reached':(state.settings.weeklyTarget-h).toFixed(1)+' hrs to target',Math.min(100,h/state.settings.weeklyTarget*100)),stat('Evidence filed',state.portfolio.length,state.portfolio.length?'items in portfolio':'none yet')));main.append(el('div',{class:'section'},'Next best action',el('span',{class:'rule'})));main.append(n?el('div',{class:'card'},el('div',{class:'label'},'WEEK '+n.week+' · '+n.stage.toUpperCase()),el('h2',{style:'margin:5px 0 12px'},n.title),el('div',{class:'muted',style:'margin-bottom:14px'},'Complete this stage, then move to the next practical step.'),el('button',{class:'btn',onclick:()=>{route='course';openWeek=n.week;render()}},'Open activity')):el('div',{class:'empty'},'All 24 weeks are complete — update your portfolio and prepare for interviews.'));main.append(el('div',{class:'section'},'Priority skill gaps',el('span',{class:'rule'})));const gaps=state.skills.map(s=>({...s,gap:s.target-s.current})).filter(s=>s.gap>0).sort((a,b)=>b.gap-a.gap).slice(0,3);main.append(el('div',{class:'card'},...gaps.map(g=>el('div',{class:'skill'},el('div',{class:'skilltop'},el('strong',{},g.name),el('span',{class:'badge'},'current '+g.current+' → target '+g.target))))));}
function course(main){main.append(head('COURSE','24-week program','Learn → Apply → Check → Evidence, one week at a time'));curriculum.forEach(c=>{const w=state.weeks[c.week-1],done=['learn','apply','check','evidence'].filter(k=>w[k]).length,open=openWeek===c.week;const box=el('div',{class:'week '+(open?'open':'')});box.append(el('button',{class:'weekhead',onclick:()=>{openWeek=open?null:c.week;render()}},el('span',{class:'wno'},'WEEK '+String(c.week).padStart(2,'0')),el('span',{class:'phase'},c.phase),el('span',{class:'wtitle'},c.title),el('span',{class:'wcount'},done+'/4'),el('span',{},'›')));const body=el('div',{class:'body'});[['learn','Learn',c.learn],['apply','Apply',c.apply],['check','Check',c.check],['evidence','Evidence',c.evidence]].forEach(([k,l,t])=>{const cb=el('input',{type:'checkbox'});cb.checked=!!w[k];cb.id='w'+c.week+k;cb.addEventListener('change',()=>{w[k]=cb.checked;save();course(document.getElementById('main'));});body.append(el('div',{class:'stage'},cb,el('label',{for:cb.id,class:'stagel'},l),el('label',{for:cb.id,class:'staget'},t)))});if(done===4)body.append(el('button',{class:'btn small ghost',style:'margin-top:10px',onclick:()=>{state.portfolio.unshift({id:Date.now(),title:'Week '+c.week+' — '+c.title,category:c.phase,desc:'Evidence produced while completing this week. Replace with a sanitized description of the actual output.'});save();toast('Added to portfolio')}},'+ Add to portfolio'));box.append(body);main.append(box)})}
function skills(main){main.append(head('SKILLS','Competency tracker','Current level vs. target level for each competency, 1–5'));const card=el('div',{class:'card'});state.skills.forEach((s,i)=>{const gap=s.target-s.current,row=el('div',{class:'skill'});row.append(el('div',{class:'skilltop'},el('strong',{},s.name),el('span',{class:'badge '+(gap<=0?'ok':'' )},gap<=0?'at target':'gap '+gap)));const track=el('div',{class:'track'});track.append(el('div',{class:'rail'}),el('div',{class:'fill',style:'width:'+((s.current-1)/4*100)+'%'}),el('div',{class:'target',style:'left:calc('+((s.target-1)/4*100)+'% - 1px)'}));const r=el('input',{type:'range',min:'1',max:'5',step:'1',value:s.current,'aria-label':s.name+' current level'});r.addEventListener('input',()=>{s.current=Number(r.value);save();skills(main)});track.append(r);row.append(track);card.append(row)});main.append(card)}

function portfolio(main){main.append(head('PORTFOLIO','Evidence','Senior-level capability represented with sanitized examples'),el('button',{class:'btn',style:'margin-bottom:16px',onclick:()=>{state.portfolio.unshift({id:Date.now(),title:'New evidence item',category:'General',desc:'Describe the deliverable, your role, and the standard applied.'});save();render()}},'+ Add evidence item'));if(!state.portfolio.length)return main.append(el('div',{class:'empty'},'No evidence yet. Complete a week in Course and add it here, or add an item manually.'));const grid=el('div',{class:'grid g2'});state.portfolio.forEach(it=>{const title=el('input',{class:'edit',value:it.title}),desc=el('textarea',{class:'edit',style:'min-height:100px;margin-top:8px'},it.desc);title.addEventListener('change',()=>{it.title=title.value;save()});desc.addEventListener('change',()=>{it.desc=desc.value;save()});grid.append(el('div',{class:'evidence'},el('div',{class:'label'},it.category||'General'),title,desc,el('button',{class:'btn small danger',style:'margin-top:10px',onclick:()=>{state.portfolio=state.portfolio.filter(x=>x.id!==it.id);save();render()}},'Remove')))});main.append(grid)}
function settings(main){main.append(head('SETTINGS','Documentation & sync','Study target, backup and learning guide'));const target=el('div',{class:'card'},el('div',{class:'skilltop'},el('strong',{},'Weekly study hours target'),el('input',{type:'number',min:'1',step:'.5',value:state.settings.weeklyTarget,style:'width:90px',onchange:e=>{state.settings.weeklyTarget=Number(e.target.value)||6;save();toast('Target updated')}}));main.append(el('div',{class:'section'},'Study target',el('span',{class:'rule'})),target);const sync=el('div',{class:'card'},el('p',{class:'muted'},'This canonical build stores progress in browser storage. JSON export/import is provided as an independent backup. Cross-device cloud sync will be added in a later backend phase.'));const ex=el('button',{class:'btn small',onclick:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='career-readiness-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}},'Export JSON backup');const inp=el('input',{type:'file',accept:'application/json',style:'display:none'});inp.addEventListener('change',async()=>{try{state={...state,...JSON.parse(await inp.files[0].text())};save();render()}catch(e){toast('Backup could not be read')}});sync.append(ex,el('button',{class:'btn small ghost',style:'margin-left:8px',onclick:()=>inp.click()},'Import JSON backup'),inp);main.append(el('div',{class:'section'},'Backup & sync',el('span',{class:'rule'})),sync);const docs=[['Learning guide','24-week Senior Electrical Designer readiness pathway using Learn → Apply → Check → Evidence.' ],['Scope','AutoCAD, MicroStation, electrical drafting/documentation, design ownership, AS/NZS application, power distribution, calculations and sizing, 3D/BIM coordination, QA/design checking, leadership/mentoring, portfolio and interview readiness.'],['Release & updates','This repository is the single canonical source for the production app function render(){renderNav();const main=$('#main');main.innerHTML='';({home,course,skills,journal,portfolio,settings}[route])(main);main.focus()}
$('#menubtn').addEventListener('click',()=>{$('#sidebar').classList.contains('mobile-open')?closeMenu():($('#sidebar').classList.add('mobile-open'),$('#scrim').classList.add('show'),$('#menubtn').setAttribute('aria-expanded','true'))});$('#scrim').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});load();render();
