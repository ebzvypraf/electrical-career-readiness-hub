<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Engine Validation</title><style>body{font:15px system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#f5f7fb;color:#172238}main{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:24px}li{margin:8px 0}.ok{color:#047857}.warn{color:#b45309}code{background:#eef2ff;padding:2px 5px;border-radius:4px}</style></head>
<body><main><h1>Learning Engine v2 Validation</h1><p>This production-side harness validates root-safe curriculum loading, stage gates, progress calculation and cross-surface integration signals without changing the existing Hub shell.</p><ul id="results"><li>Running validation…</li></ul></main><script type="module">
import {CURRICULUM_URLS,loadCatalog,stageProgress,totalProgress,nextStage,canCompleteStage,isStageUnlocked,applyStageCompletion,buildIntegrationSnapshot} from './learning-engine-v2.js';
const out=document.querySelector('#results'); const rows=[];
try{
 const catalog=await loadCatalog(CURRICULUM_URLS);
 const ids=Object.keys(catalog);
 rows.push(`<li class="ok"><b>Catalog load</b>: PASS — ${ids.length} curriculum weeks loaded (${ids.join(', ')}).</li>`);
 for(const id of ids){
  const week=catalog[id];
  const ok=!!week.title&&!!week.learn&&!!week.apply&&!!week.check&&!!week.evidence;
  rows.push(`<li class="${ok?'ok':'warn'}"><b>Week ${id}</b>: ${ok?'PASS':'INCOMPLETE'} — ${week.title}; ${week.check.questions?.length||0} check question(s); ${week.evidence.criteria?.length||0} evidence criterion/criteria.</li>`);
 }
 const state={...Object.fromEntries(ids.map(id=>[id,{learn:false,apply:false,check:false,evidence:false}]))};
 state['1'].learn=true; state['2'].learn=true; state['2'].apply=true;
 rows.push(`<li class="ok"><b>Progress</b>: PASS — ${totalProgress(state)} / ${ids.length*4} stages completed.</li>`);
 const n=nextStage(state,ids); rows.push(`<li class="ok"><b>Next-stage resolver</b>: PASS — Week ${n.weekId}, ${n.stage}.</li>`);
 const blocked=applyStageCompletion(state,'1','apply',{}); rows.push(`<li class="ok"><b>Apply gate</b>: ${blocked.ok?'FAIL':'PASS'} — notes are required before Apply completion.</li>`);
 const locked=applyStageCompletion(state,'1','check',{score:2,total:3}); rows.push(`<li class="ok"><b>Stage order</b>: ${locked.ok?'FAIL':'PASS'} — Check cannot be completed before Apply.</li>`);
 const applied=applyStageCompletion(state,'1','apply',{applicationNotes:'sample engineering notes'}); rows.push(`<li class="ok"><b>Apply completion</b>: ${applied.ok?'PASS':'FAIL'} — learner notes unlock completion.</li>`);
 const checked=applyStageCompletion({...state,'1':{...state['1'],apply:true}},'1','check',{score:2,total:3}); rows.push(`<li class="ok"><b>Check gate</b>: ${checked.ok?'PASS':'FAIL'} — passing reasoning score accepted.</li>`);
 const snap=buildIntegrationSnapshot(catalog,state,{'1':{evidence:{title:'sample',description:'sample'}}});
 const linked=snap.weeks.find(w=>w.weekId==='1');
 rows.push(`<li class="ok"><b>Integration snapshot</b>: ${linked&&linked.signals.evidenceReady?'PASS':'FAIL'} — evidence readiness is available to Home/Skills/Journal/Portfolio consumers.</li>`);
}catch(e){rows.push(`<li class="warn"><b>Validation</b>: FAIL — ${e.message}</li>`)}
out.innerHTML=rows.join('');
</script></body></html>
