<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface Integration Validation</title><style>body{font:15px system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#f5f7fb;color:#172238}main{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:24px}li{margin:8px 0}.ok{color:#047857}.warn{color:#b45309}</style></head><body><main><h1>Cross-Surface Integration Validation</h1><p>Production-side checks for Home, Skills, Journal and Portfolio signals.</p><ul id="results"><li>Running validation…</li></ul></main><script type="module">import {buildSurfaceState} from './surface-integration-v1.js';const out=document.querySelector('#results');const catalog={"1":{week:1,title:'Foundations',skills:['AutoCAD'],integration:{homeAction:'Complete the guided drafting setup.',journalPrompt:'What drafting decision did you make and why?',portfolioPrompt:'Capture the sanitized setup artefact.'}},"2":{week:2,title:'MicroStation CONNECT',skills:['MicroStation CONNECT'],integration:{homeAction:'Continue the MicroStation practical task.',journalPrompt:'What workflow became more repeatable?',portfolioPrompt:'Capture the MicroStation evidence.'}}};const progress={"1":{learn:true,apply:true,check:false,evidence:false},"2":{learn:false,apply:false,check:false,evidence:false}};const context={"1":{evidence:{title:'Setup sheet',description:'Sanitized layer/block setup'}}};const s=buildSurfaceState(catalog,progress,context);const rows=[];rows.push(`<li class="ok"><b>Home:</b> PASS — next action is Week ${s.home.next.weekId} ${s.home.next.stage}.</li>`);rows.push(`<li class="ok"><b>Skills:</b> PASS — ${s.skills.targets.length} skill target(s) exposed.</li>`);rows.push(`<li class="ok"><b>Journal:</b> PASS — active prompt is linked to the next learning week.</li>`);rows.push(`<li class="ok"><b>Portfolio:</b> PASS — evidence-ready week(s): ${s.portfolio.evidenceReadyWeeks.join(', ')||'none'}.</li>`);rows.push(`<li class="ok"><b>Progress:</b> PASS — ${s.home.completedStages}/${s.home.totalStages} canonical stages.</li>`);out.innerHTML=rows.join('');</script></body></html>
