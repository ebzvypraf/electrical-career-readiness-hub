name: Integrate authored assessment UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject assessment UI adapter safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="/curriculum/assessment-ui-adapter-v1.js"></script>'
          if marker in text:
              print('Assessment UI adapter already integrated.')
              raise SystemExit(0)
          needle = '</body>'
          if needle not in text:
              raise SystemExit('Missing </body>; refusing to modify the production entry.')
          text = text.replace(needle, marker + '\n' + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration only when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No integration change needed."
            exit 0
          fi
          git add index.html
          git commit -m "feat: wire authored assessment UI into Course"
          git push
