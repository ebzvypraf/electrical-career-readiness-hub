name: Integrate authored assessment UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded Course integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          changed = False

          marker = '<script src="/curriculum/assessment-ui-adapter-v1.js"></script>'
          if marker not in text:
              needle = '</body>'
              if needle not in text:
                  raise SystemExit('Missing </body>; refusing to modify the production entry.')
              text = text.replace(needle, marker + '\n' + needle, 1)
              changed = True

          old = 'window.ECRH={saveNote,check,saveEvidence,complete,close};'
          new = 'window.ECRH={saveNote,check,saveEvidence,complete,close,setCheckResult:(i,result)=>{state.checks[i]=result;save();render()}};'
          if old in text:
              text = text.replace(old, new, 1)
              changed = True
          elif new not in text:
              raise SystemExit('Expected ECRH API contract not found; refusing to modify the production entry.')

          path.write_text(text, encoding='utf-8')
          print('Course integration changed:', changed)
          PY

      - name: Commit integration only when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No integration change needed."
            exit 0
          fi
          git add index.html
          git commit -m "feat: wire canonical assessment state into Course"
          git push
