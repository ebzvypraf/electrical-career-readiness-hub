name: Learning engine contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run learning-engine contract suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "Running $test"
            node "$test"
          done
