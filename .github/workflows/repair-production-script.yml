name: Repair production script syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair escaped object key in production entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          bad = chr(92) + '"' + "'" + chr(92) + '"' + ':'
          good = '"' + "'" + '"' + ':'
          if bad not in text:
              raise SystemExit('No malformed key found; refusing to modify the baseline.')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY

      - name: Commit repair only when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No repair needed."
            exit 0
          fi
          git add index.html
          git commit -m "fix: repair production UI script syntax"
          git push
