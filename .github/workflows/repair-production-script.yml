name: Repair production script syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair escaped object key in production entry
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          bad = r'\\"\'\\":\'&#39;\''
          good = r'"\'":\'&#39;\''
          if bad not in text:
              raise SystemExit('No malformed key found; refusing to modify the baseline.')
          updated = text.replace(bad, good, 1)
          path.write_text(updated, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: repair production UI script syntax"
          git push
